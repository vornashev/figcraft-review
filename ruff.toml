line-length = 120
extend-exclude = ["sidecar/web"]

[lint]
select = ["E4", "E7", "E9", "F"]
# One-line `a; b` and short names like `l` are the house style.
ignore = ["E702", "E731", "E741"]

[lint.per-file-ignores]
# The design scripts build on each other with star imports.
"design/*" = ["F403", "F405"]
