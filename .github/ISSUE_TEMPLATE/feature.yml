name: Idea
description: Suggest a feature or a change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and what gets in the way, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
