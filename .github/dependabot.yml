version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /sidecar/web
    schedule: {interval: weekly}
    groups:
      web: {patterns: ["*"]}
    ignore:  # TypeScript 7 is native and drops the JS API that skills/read_theme_presets.mjs parses with
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
